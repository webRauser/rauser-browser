<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{APP_NAME}} · Stash</title>
    <link rel="stylesheet" href="stash.css" />
  </head>
  <body>
    <main aria-labelledby="stash-title">
      <header class="stash-header">
        <h1 id="stash-title">{{APP_NAME}} Stash</h1>
        <div class="stash-tools">
          <button id="stash-refresh" type="button">Refresh</button>
          <button id="stash-settings" type="button">Settings</button>
        </div>
        <div class="stash-controls">
          <div class="stash-filters" role="group" aria-label="Reading status">
            <button type="button" data-stash-filter="open" aria-pressed="true">To read</button>
            <button type="button" data-stash-filter="done" aria-pressed="false">Done</button>
            <button type="button" data-stash-filter="all" aria-pressed="false">All</button>
          </div>
          <div class="stash-search" role="search">
            <label for="stash-search" class="visually-hidden">Search saved pages by title or source</label>
            <input id="stash-search" type="search" maxlength="256" autocomplete="off" placeholder="Search titles or sources" />
          </div>
        </div>
      </header>
      <p id="stash-status" role="status">Waiting for the native host…</p>
      <div id="stash-layout" data-view="results" hidden>
        <section id="stash-results" aria-labelledby="stash-results-heading">
          <h2 id="stash-results-heading" tabindex="-1">Saved pages</h2>
          <div id="stash-results-body">
            <ul id="stash-list" aria-label="Saved pages" hidden></ul>
            <button id="stash-more" type="button" hidden>Load more saved pages</button>
          </div>
        </section>
        <section id="stash-preview" aria-label="Selected saved page" hidden>
          <button id="stash-back" type="button">Back to results</button>
          <div id="stash-detail"></div>
        </section>
      </div>
    </main>
    <script type="module" src="stash.js"></script>
  </body>
</html>
